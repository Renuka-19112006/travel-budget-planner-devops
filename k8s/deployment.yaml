apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-budget-planner
  namespace: travel-budget
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-budget-planner
  template:
    metadata:
      labels:
        app: travel-budget-planner
    spec:
      containers:
        - name: travel-budget-planner
          image: travel-budget-planner:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
